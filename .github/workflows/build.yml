# Builds the image and pushes it to GHCR. The image contains only the
# downloader and nginx; firmware is fetched from Dell when the container starts.
#
#   docker run -d -p 80:80 -v dell-firmware:/repo -e MODELS=T630 ghcr.io/<owner>/<repo>
name: Build image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "run.sh", "wizard.sh"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          push: true
