server {
    listen 80 default_server;
    root /repo;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Internal file recording the settings /repo was built with.
    location = /.build-settings {
        return 404;
    }

    location = /versions.txt {
        default_type text/plain;
        charset utf-8;
    }
}
